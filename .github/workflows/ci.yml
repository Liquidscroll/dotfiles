name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t dotfiles-test .
      - name: Install using bash and fish
        run: docker run --rm dotfiles-test bash -c "./dotfiles.sh install --shell bash && ./dotfiles.sh install --shell fish"
      - name: Run tests
        run: docker run --rm dotfiles-test
