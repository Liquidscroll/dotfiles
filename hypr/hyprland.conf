### MONITORS ###

monitor=desc:G.VISION K27FM75 0x00000001,1920x1080@75,auto,auto
monitor=desc:Sanyo Electric Co.Ltd. SANYO TV 0x00000001,1920x1080,auto,1

### MY PROGRAMS ###

$terminal = uwsm app -- wezterm
$weztermCLI = $terminal cli
$fterm = uwsm app -- foot
$fileManager = uwsm app -- ~/scripts/launch-yazi.sh
$drun = uwsm app -- $(tofi-drun)
$run = uwsm app -- $(tofi-run)
$clipboardWindow = uwsm app -- wezterm start --class clipse -e clipse 

### AUTOSTART ###

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP 

exec-once = uwsm app -- eww open-many primary_bar secondary_bar
exec-once = $terminal
exec-once = uwsm app -- clipse -listen
exec-once = uwsm app -- zen-browser 
exec-once = uwsm app -- discord 
exec-once = uwsm app -- nm-applet.desktop
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- spotify-launcher %U
